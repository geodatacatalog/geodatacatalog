    api_endpoint: https://raw.githubusercontent.com/nvkelso/natural-earth-vector/master/geojson
    need_auth: false
  products:
    ne_10m_rivers_lake_centerlines_geojson:
      productType: ne_10m_rivers_lake_centerlines.geojson
      description: Rivers & lake centerlines — 10m, detailed (named, incl. major fleuves like the Nile)
    ne_10m_rivers_lake_centerlines:
      productType: ne_10m_rivers_lake_centerlines
      description: Global river/fleuve POLYLINES (one named line per major river — the Nile, Amazon…), plus lake
        centerlines. Static GeoJSON (the whole file is fetched, then clipped to the AOI client-side), EPSG:4326.
        Use 10m for detail/names, 50m or 110m for a light world overview. No server-side bbox filter.
