    need_auth: false
    queryParam: scientificName
    dataKey: results
    lonField: decimalLongitude
    latField: decimalLatitude
    bboxParams:
      decimalLatitude: '{miny},{maxy}'
      decimalLongitude: '{minx},{maxx}'
    params:
      hasCoordinate: 'true'
      hasGeospatialIssue: 'false'
    datetimeParam: year
    paginate:
      offset_param: offset
      limit_param: limit
      page_size: 300
      max_records: 5000
      end_field: endOfRecords
  products:
    gypaete_barbu:
