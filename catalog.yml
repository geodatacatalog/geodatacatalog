earth_search:
  search:
    type: StacSearch
    api_endpoint: https://earth-search.aws.element84.com/v1/search
    need_auth: false
  auth:
    no-sign-request: true
  products:
    S2_L2A:
      productType: sentinel-2-l2a
      description: Sentinel-2 L2A surface reflectance (10 m, COG)
      cloudCover: 100
      bandMapping:
      - aot: aerosol
      - coastal: coastal
      - blue: blue
      - green: green
      - red: red
      - rededge1: rededge071
      - rededge2: rededge074
      - rededge3: rededge078
      - nir: nir
      - nir08: nir08
      - nir09: nir09
      - swir16: swir16
      - swir22: swir22
      - scl: scl
      - wvp: wvp
      - visual: tci
      - thumbnail: thumbnail
    S1_GRD:
      productType: sentinel-1-grd
      description: 'Sentinel-1 SAR GRD (VV/VH backscatter). NEEDS AUTH: data is in the requester-pays s3://sentinel-s1-l1c
        bucket (AWS creds + requester-pays, egress billed) — for a free alternative use cop_dataspace.S1_GRD.'
      bandMapping:
      - vh: grd_c_vh
      - vv: grd_c_vv
      - thumbnail: thumbnail
    LANDSAT_C2L2:
      productType: landsat-c2-l2
      description: 'Landsat Collection 2 Level-2 surface reflectance (30 m). NEEDS AUTH: data is in the requester-pays
        s3://usgs-landsat bucket (AWS creds + requester-pays, egress billed).'
      bandMapping:
      - coastal: coastal
      - blue: blue
      - green: green
      - red: red
      - nir08: nir08
      - swir16: swir16
      - swir22: swir22
      - lwir11: lwir11
      - qa_pixel: qa_pixel
      - thumbnail: thumbnail
    COP_DEM_GLO30:
      productType: cop-dem-glo-30
      description: Copernicus global DEM (30 m)
      static: true
      bandMapping:
      - data: data
    sentinel_2_l2a:
      productType: sentinel-2-l2a
      description: Global Sentinel-2 data from the Multispectral Instrument (MSI) onboard Sentinel-2
cop_dataspace:
  search:
    type: StacSearch
    api_endpoint: https://stac.dataspace.copernicus.eu/v1/search
    need_auth: true
  auth:
    type: AwsAuth
    s3_endpoint: eodata.dataspace.copernicus.eu
    https: true
    virtual_hosting: false
    gdal_unsafe_ssl: true
    credentials:
      aws_access_key_id: ${CDSE_S3_ACCESS_KEY}
      aws_secret_access_key: ${CDSE_S3_SECRET_KEY}
      region_name: default
  products:
    S2_L2A:
      productType: sentinel-2-l2a
      description: Sentinel-2 L2A from the official ESA archive
      bandMapping:
      - AOT_10m: aerosol
      - B01_20m: coastal
      - B02_10m: blue
      - B03_10m: green
      - B04_10m: red
      - B05_20m: rededge071
      - B06_20m: rededge075
      - B07_20m: rededge078
      - B08_10m: nir
      - B8A_20m: nir08
      - B09_60m: nir09
      - B11_20m: swir16
      - B12_20m: swir22
      - WVP_10m: wvp
      - SCL_20m: scl
      - TCI_10m: tci
      - thumbnail: thumbnail
    S1_GRD:
      productType: sentinel-1-grd
      description: Sentinel-1 SAR GRD (VV/VH backscatter) from the official ESA archive (COG)
      bandMapping:
      - vh: grd_c_vh
      - vv: grd_c_vv
      - thumbnail: thumbnail
    S5P_NO2:
      productType: sentinel-5p-l2-no2-offl
      description: Sentinel-5P tropospheric NO2 (air quality)
      bandMapping:
      - netcdf: no2
    sentinel_2_l2a:
      productType: sentinel-2-l2a
      description: 'The Sentinel-2 Level-2A Collection 1 product provides orthorectified Surface Reflectance (Bottom-Of-Atmosphere:
        BOA), with sub-pixel multispectral and multitemporal registration accuracy. Scene Classification (including
        Clouds and Cloud Shadows), AOT (Aerosol Optical Thickness) and WV (Water Vapour) maps are included in the
        product.'
