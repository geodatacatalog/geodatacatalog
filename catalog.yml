    need_auth: false
  products:
    states_all:
      productType: states/all
      description: Live aircraft positions. Responses are positional ARRAYS (state vectors), so the shipped opensky.py
        plugin maps them to points (states/all). Anonymous access is rate-limited; a free OpenSky account (auth.credentials
        username/password) raises the limits.
    states:
      productType: states
      description: Live aircraft positions. Responses are positional ARRAYS (state vectors), so the shipped opensky.py
        plugin maps them to points (states/all). Anonymous access is rate-limited; a free OpenSky account (auth.credentials
        username/password) raises the limits.
sentinelhub:
  search:
    type: geodata_sentinelhubapi.py
    api_endpoint: https://sh.dataspace.copernicus.eu/api/v1/process
    need_auth: true
  auth:
    credentials:
      client_id: ${SH_CDSE_CLIENT_ID}
      client_secret: ${SH_CDSE_CLIENT_SECRET}
  products:
    ndvi:
      productType: NDVI
      description: NDVI (vegetation index) — spyndex formula on Sentinel-2 L2A, SCL cloud-masked
    nbr:
      productType: NBR
      description: NBR (normalized burn ratio) — spyndex index
    dnbr:
      productType: dNBR
      description: dNBR (burn severity) — NBR difference between the two ends of the datetime range (NBR[date2]
        - NBR[date1], each composited over ~30 days); works for any index (dBAI, dNDVI...)
    b08_nir:
      productType: B08
      description: Sentinel-2 band B08 (NIR, 10 m) surface reflectance
    NDMI:
      productType: NDMI
      description: THE source for named spectral INDICES — any spyndex Sentinel-2 index (NDVI, NDMI, NBR, NDWI,
        EVI, SAVI...) — and single BANDS (B01-B12), computed on the fly from Sentinel-2 L2A (SCL cloud-masked) via
        the geodata_sentinelhubapi.py plugin. productType = the index/band name. STAC collections only expose RAW
        bands, not named indices — use THIS for an index. Needs CDSE_CLIENT_ID/CDSE_CLIENT_SECRET.
    MSI:
      productType: MSI
      description: THE source for named spectral INDICES — any spyndex Sentinel-2 index (NDVI, NDMI, NBR, NDWI,
        EVI, SAVI...) — and single BANDS (B01-B12), computed on the fly from Sentinel-2 L2A (SCL cloud-masked) via
        the geodata_sentinelhubapi.py plugin. productType = the index/band name. STAC collections only expose RAW
        bands, not named indices — use THIS for an index. Needs CDSE_CLIENT_ID/CDSE_CLIENT_SECRET.
    NBR:
      productType: NBR
      description: NBR — Normalized Burn Ratio
gdacs:
  search:
    type: REST
    api_endpoint: https://www.gdacs.org/gdacsapi
    need_auth: false
  products:
