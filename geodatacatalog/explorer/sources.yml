- id: sentinelhub
  name: Sentinel Hub — indices & bandes spectrales (CDSE)
  type: rest
  endpoint: https://sh.dataspace.copernicus.eu/api/v1/process
  provider: Copernicus Data Space / Sentinel Hub
  coverage: global
  themes:
  - satellite
  - imagery
  - agriculture
  - forest
  auth: api_key
  auth_url: https://shapps.dataspace.copernicus.eu/dashboard/#/account/settings
  test:
    url: https://shapps.dataspace.copernicus.eu/dashboard/
  layers:
  - id: NDVI
    title: NDVI — végétation
  - id: NDMI
    title: NDMI — humidité de la végétation
  - id: NBR
    title: NBR — indice de brûlure (feux)
  - id: NDWI
    title: NDWI — eau / humidité
  - id: EVI
    title: EVI — végétation (amélioré)
  - id: B08
    title: Bande B08 — proche infrarouge (réflectance)
  - id: B11
    title: Bande B11 — SWIR (réflectance)
  - id: dNBR
    title: dNBR — différence NBR entre deux dates (sévérité des feux)
  - id: dNDVI
    title: dNDVI — différence NDVI entre deux dates (changement de végétation)
  - id: dBAI
    title: dBAI — différence BAI entre deux dates (zones brûlées)
  catalog:
    plugin: geodata_sentinelhubapi.py
    free_product: any spyndex Sentinel-2 index (NDVI, NDMI, NBR, MSI, SAVI, BAI, NDRE...), a band (B01-B12, B8A),
      or its d-prefixed two-date difference (dNBR, dBAI... = index[date2] - index[date1] over a datetime range;
      a single date compares that month to the month before)
    credentials:
      client_id: ${SH_CDSE_CLIENT_ID}
      client_secret: ${SH_CDSE_CLIENT_SECRET}
  notes: THE source for named spectral INDICES — any spyndex Sentinel-2 index (NDVI, NDMI, NBR, NDWI, EVI, SAVI...)
    — and single BANDS (B01-B12), computed on the fly from Sentinel-2 L2A (SCL cloud-masked) via the Sentinel Hub
    Processing API. productType = the index/band name; prefix it with d (dNBR, dBAI, dNDVI...) for the CHANGE between
    the two ends of the datetime range (index[date2] - index[date1], e.g. burn severity). STAC collections only
    expose RAW bands, not named indices — use THIS for an index. Needs a CDSE OAuth client ID/secret.
  summary: On-the-fly Sentinel-2 spectral indices (NDVI, NBR...) and raw bands via Sentinel Hub (CDSE).
  status:
    state: ok
    latency_ms: 247
    checked_at: '2026-08-08'
    detail: HTTP 200
  fetch:
    state: auth_required
    detail: auth=api_key, no creds in env
    layer: null
    checked_at: '2026-08-08'
