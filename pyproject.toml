[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "geodatacatalog"
version = "0.1.0"
description = "Fetch heterogeneous geospatial sources (WFS, WMS, WMTS, WCS, STAC, OSM, REST, Python plugins) through one YAML-configured catalog, with caching and parallel download."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tanguy Duval" }]
keywords = [
    "geospatial", "gis", "stac", "wfs", "wms", "wmts", "wcs",
    "sentinel", "copernicus", "ign", "catalog", "geopandas", "xarray",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: GIS",
]

dependencies = [
    "aiohttp",
    "diskcache",
    "geopandas>=0.14",
    "numpy",
    "odc-stac",
    "owslib",
    "pandas",
    "Pillow",
    "pyogrio",        # geopandas vector IO engine (read_file/to_file/export)
    "pyproj",
    "pystac",
    "pystac-client",
    "pyyaml",
    "rasterio",
    "requests",
    "rioxarray",
    "shapely>=2.0",
    "xarray",
]

[project.optional-dependencies]
viz = ["folium", "ipywidgets", "matplotlib", "mapclassify"]
osm = ["osmnx"]
s3 = ["boto3"]                  # signed S3 downloads (e.g. Copernicus Data Space)
overture = ["pmtiles", "mapbox-vector-tile", "mercantile", "duckdb"]  # Overture: vector-tile path (default, fast) + GeoParquet path (duckdb, exact)
jupyter = ["nest_asyncio", "ipywidgets", "folium", "matplotlib", "mapclassify"]
netcdf = ["netcdf4", "odc-algo", "h5netcdf", "fsspec[http]", "s3fs"]  # h5netcdf+fsspec: windowed remote read of NetCDF/HDF5 STAC assets (e.g. PC deltares-floods); s3fs: those hosted on S3 (e.g. Copernicus CLMS *.nc)
all = ["folium", "ipywidgets", "osmnx", "boto3", "duckdb", "pmtiles", "mapbox-vector-tile", "mercantile", "matplotlib", "mapclassify", "nest_asyncio", "netcdf4", "odc-algo", "h5netcdf", "fsspec[http]", "s3fs"]
dev = ["pytest", "ruff"]

[project.scripts]
geodatacatalog = "geodatacatalog.explorer.cli:main"

[project.urls]
Homepage = "https://github.com/tduval/geodatacatalog"
Documentation = "https://github.com/tduval/geodatacatalog#readme"
Issues = "https://github.com/tduval/geodatacatalog/issues"

[tool.hatch.build.targets.wheel]
packages = ["geodatacatalog"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"
